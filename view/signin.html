<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }
    html {
  scroll-behavior: smooth;
  }
   .error{
    color: brown;
   }
    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .login-container{
      width:350px;
      background:white;
      padding:30px;
      border-radius:15px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    .login-container h2{
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    .input-group{
      margin-bottom:18px;
    }

    .input-group label{
      display:block;
      margin-bottom:6px;
      color:#555;
      font-size:14px;
    }

    .input-group input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      transition:0.3s;
    }

    .input-group input:focus{
      border-color:#667eea;
      box-shadow:0 0 5px rgba(102,126,234,0.5);
    }

    .login-btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#667eea;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      background:#5a67d8;
    }

    .extra-links{
      margin-top:15px;
      text-align:center;
      font-size:14px;
    }

    .extra-links a{
      text-decoration:none;
      color:#667eea;
      font-weight:bold;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Group Chat Login</h2>

    <form id="signin">
      
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="txtemail" placeholder="Enter your email">
        <p class="error"></p>
      </div>

      <div class="input-group">
        <label>Phone Number</label>
        <input type="tel" id="txtphone" placeholder="Enter your phone number">
        <p class="error"></p>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="txtpassword" placeholder="Enter your password" required>
        <p class="error"></p>
      </div>

      <button type="submit" class="login-btn">
        Login
      </button>

      <div class="extra-links">
        <p><a href="#">Forgot Password?</a></p>
        <br>
        <p>Don't have an account? <a href="../view/signup.html">Sign Up</a></p>
      </div>

    </form>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
 <script>
 window.addEventListener("DOMContentLoaded", () => {

  const signin = document.getElementById("signin");
  const API_BASE_URL = "http://localhost:4000";

  const emailInput = document.getElementById("txtemail");
  const phoneInput = document.getElementById("txtphone");
  const passwordInput = document.getElementById("txtpassword");

  const btn = document.querySelector(".login-btn");

  signin.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = emailInput.value.trim();
    const phone = phoneInput.value.trim();
    const password = passwordInput.value.trim();

    // 🔥 BASIC VALIDATION
    if (!email || !password) {
      alert("Email and password are required!");
      return;
    }

    try {

      // LOADING STATE
      btn.disabled = true;
      btn.innerText = "Logging in...";

      const response = await axios.post(
        `${API_BASE_URL}/chat-app/signin`,
        { email, phone, password }
      );

      const { token, user, message } = response.data;

      if (!token || !user) {
        alert("Invalid credentials!");
        return;
      }

      // STORE USER DATA
      localStorage.setItem("token", token);
      localStorage.setItem("userId", user.userId);
      localStorage.setItem("username", user.name);

      alert(message || "Login successful");

      // REDIRECT
      window.location.href = "./chatBoard.html";

    } catch (err) {

      console.log(err);

      alert(err.response?.data?.message || "Login failed");

    } finally {

      // RESET BUTTON
      btn.disabled = false;
      btn.innerText = "Login";

    }

  });

});
</script>
</body>
</html>
