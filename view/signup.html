<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Group Chat Signup</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }
  html {
  scroll-behavior: smooth;
  }
    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }

    .signup-container{
      width:350px;
      background:#fff;
      padding:30px;
      border-radius:15px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    .signup-container h2{
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    .input-group{
      margin-bottom:18px;
    }

    .input-group label{
      display:block;
      margin-bottom:6px;
      color:#555;
      font-size:14px;
    }

    .input-group input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      transition:0.3s;
    }

    .input-group input:focus{
      border-color:#4facfe;
      box-shadow:0 0 5px rgba(79,172,254,0.5);
    }

    .signup-btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#4facfe;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .signup-btn:hover{
      background:#2196f3;
    }

    .login-link{
      text-align:center;
      margin-top:15px;
      font-size:14px;
    }

    .login-link a{
      text-decoration:none;
      color:#2196f3;
      font-weight:bold;
    }
  </style>
  
</head>
<body>

  <div class="signup-container">
    <h2>Group Chat Signup</h2>

    <form id="signup">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="txtname" name="name" placeholder="Enter your name" required>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="txtemail" name="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Phone</label>
        <input type="text" id="txtphone" name="phone" placeholder="Choose a phone" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="txtpassword" name="password" placeholder="Create password" required>
      </div>

      <button type="submit" class="signup-btn">
        Sign Up
      </button>

      <div class="login-link">
        Already have an account?
        <a href="../view/signin.html">Login</a>
      </div>
    </form>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
 <script>
window.addEventListener("DOMContentLoaded", () => {

  const API_BASE_URL = "http://localhost:4000";
  const signup = document.getElementById("signup");

  signup.addEventListener("submit", async (e) => {

    e.preventDefault();

    try {

      const name = document.getElementById("txtname").value;
      const email = document.getElementById("txtemail").value;
      const phone = document.getElementById("txtphone").value;
      const password = document.getElementById("txtpassword").value;

      if (!name || !email || !phone || !password) {
        alert("All fields are required!");
        return;
      }

      const payload = {
        name,
        email,
        phone,
        password
      };

      const response = await axios.post(
        `${API_BASE_URL}/chat-app/signup`,
        payload
      );

      console.log(response.data);

      const { message } = response.data;

      alert(message || "Account Created");

      window.location.href = "./signin.html";

    } catch (err) {

      console.log(err);

      alert(
        err.response?.data?.message || "Signup failed"
      );
    }

  });

});
</script>
</body>
</html>
