<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Group Chat UI</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }
    #media{
  position: relative;
  cursor: pointer;
   }
    #media::after{
  content: "";
  position: absolute;
  opacity: 0;
  transition: 0.3s;
}

#media:hover::after{
  content: "Media Share";
  opacity: 1;
  position: absolute;
  top: -30px;
  left: 0;
  background: #222;
  color: white;
  padding: 5px 10px;
  border-radius: 5px;
  font-size: 12px;
  white-space: nowrap;
}
    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111b21;
    }

    .chat-container{
      width:420px;
      height:90vh;
      background:#0b141a;
      border-radius:15px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-shadow:0 0 20px rgba(0,0,0,0.5);
    }

    /* Header */

    .chat-header{
      height:70px;
      background:#202c33;
      display:flex;
      align-items:center;
      padding:0 20px;
      color:white;
      border-bottom:1px solid #2a3942;
    }

    .avatar{
      width:45px;
      height:45px;
      border-radius:50%;
      background:#25d366;
      display:flex;
      justify-content:center;
      align-items:center;
      font-weight:bold;
      margin-right:15px;
      color:white;
    }

    .chat-info h3{
      font-size:17px;
    }

    .chat-info p{
      font-size:12px;
      color:#8696a0;
      margin-top:3px;
    }

    /* Chat Messages */

    .chat-body{
      flex:1;
      padding:20px;
      overflow-y:auto;
      scroll-behavior:smooth;
      display:flex;
      flex-direction:column;
      background:#0b141a;
    }

    .message{
      max-width:75%;
      padding:10px 14px;
      margin-bottom:15px;
      border-radius:10px;
      position:relative;
      line-height:1.4;
      word-wrap:break-word;
    }

    .received{
      background:#202c33;
      color:white;
      align-self:flex-start;
      border-top-left-radius:2px;
    }

    .sent{
      background:#005c4b;
      color:white;
      align-self:flex-end;
      border-top-right-radius:2px;
    }

    .timestamp{
      display:block;
      font-size:11px;
      color:#c7d1d6;
      margin-top:5px;
      text-align:right;
    }

    /* Input Area */

    .chat-footer{
      height:70px;
      background:#202c33;
      display:flex;
      align-items:center;
      padding:10px;
      gap:10px;
      border-top:1px solid #2a3942;
    }

    .chat-footer input{
      flex:1;
      padding:12px 15px;
      border:none;
      outline:none;
      border-radius:25px;
      background:#2a3942;
      color:white;
      font-size:15px;
    }

    .chat-footer input::placeholder{
      color:#8696a0;
    }

    .send-btn{
      width:50px;
      height:50px;
      border:none;
      border-radius:50%;
      background:#25d366;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    .send-btn:hover{
      background:#20bd5a;
    }

    /* Scrollbar */

    .chat-body::-webkit-scrollbar{
      width:6px;
    }

    .chat-body::-webkit-scrollbar-thumb{
      background:#2a3942;
      border-radius:10px;
    }

  </style>
</head>

<body>

  <div class="chat-container">

    <!-- Header -->
      <div>
        <label for="txtemail" style="color: #fff; margin-left: 3px;">Email:</label>
        <input type="text" id="txtemail" placeholder="Enter join email" style="padding: 5px; cursor: pointer;">
        <button id="joinbtn" style="padding: 5px;">Join</button>
      </div>
    <div class="chat-header">
     
      <div class="avatar">G</div>

      <div class="chat-info">
        <h3>Group Chat</h3>
        <p>Online</p>
      </div>

    </div>

    <!-- Chat Body -->
    <div class="chat-body" id="chatBody"></div>

    <!-- Footer -->
    <form class="chat-footer" id="chatForm">
        <label id="media" for="mediaInput" style="cursor:pointer;color:white;font-size:22px;">
    📎
  </label>

  <input  type="file" id="mediaInput" style="display:none" />
  <input type="text"  id="messageInput" placeholder="Type a message..."autocomplete="off" />
    

      <button class="send-btn" type="submit">
        ➤
      </button>
    </form>
  </div>
 <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
window.addEventListener("DOMContentLoaded", () => {

  const API_BASE_URL = "http://localhost:4000";

  const token = localStorage.getItem("token");
  const userId = localStorage.getItem("userId");

  const chatForm = document.getElementById("chatForm");
  const chatBody = document.getElementById("chatBody");
  const messageInput = document.getElementById("messageInput");
  const joinbtn = document.getElementById("joinbtn");
  const mediaInput = document.getElementById("mediaInput");

  // SOCKET
  const socket = io(API_BASE_URL, {
    auth: { token }
  });

  window.roomName = null;

  // LOAD OLD MESSAGES
  loadMessages();

  // JOIN ROOM
  joinbtn.addEventListener("click", () => {

    const email = document.getElementById("txtemail").value.trim();

    if (!email) return alert("Enter room email");

    socket.emit("join-room", email);

    window.roomName = email;

    alert(`Joined room: ${email}`);
  });

  // =========================
  // INSTANT MEDIA PREVIEW
  // =========================
  mediaInput.addEventListener("change", (e) => {

    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (event) {

      const fileUrl = event.target.result;

      appendMediaPreview(file, fileUrl);
    };

    reader.readAsDataURL(file);
  });

  // =========================
  // CHAT FORM (TEXT ONLY)
  // =========================
  chatForm.addEventListener("submit", (e) => {

    e.preventDefault();

    const message = messageInput.value.trim();

    if (!window.roomName) {
      return alert("Please join a room first");
    }

    if (message) {

      socket.emit("personal_message", {
        message,
        roomName: window.roomName
      });

      appendMessage({
        message,
        userId: userId,
        createdAt: new Date()
      });
    }

    messageInput.value = "";
    mediaInput.value = "";
  });

  // =========================
  // RECEIVE MESSAGE
  // =========================
  socket.on("receive_message", (msg) => {
    appendMessage(msg);
  });

  // =========================
  // LOAD OLD MESSAGES
  // =========================
  async function loadMessages() {

    try {

      const response = await axios.get(
        `${API_BASE_URL}/chat-app/get-chats`,
        {
          headers: {
            Authorization: `Bearer ${token}`
          }
        }
      );

      const allmsg = response.data.data;

      chatBody.innerHTML = "";

      allmsg.forEach(msg => appendMessage(msg));

    } catch (err) {
      console.log(err);
    }
  }

  // =========================
  // TEXT MESSAGE RENDER
  // =========================
  function appendMessage(msg) {

    if (!msg) return;

    const div = document.createElement("div");

    const msgUserId = msg.userId || msg.Signup?.userId;

    const name = msg.name || msg.Signup?.name || "Unknown";

    if (Number(msgUserId) === Number(userId)) {
      div.classList.add("message", "sent");
    } else {
      div.classList.add("message", "received");
    }

    const time = new Date(msg.createdAt || Date.now())
      .toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });

    div.innerHTML = `
      ${msg.message || ""}
      <br>
      <small>from ${name}</small>
      <span class="timestamp">${time}</span>
    `;

    chatBody.appendChild(div);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  // =========================
  // MEDIA PREVIEW RENDER
  // =========================
  function appendMediaPreview(file, fileUrl) {

    const div = document.createElement("div");
    div.classList.add("message", "sent");

    let content = "";

    if (file.type.startsWith("image")) {
      content = `
        <img src="${fileUrl}"
          style="width:100%; border-radius:10px; margin-top:5px;" />
      `;
    }

    else if (file.type.startsWith("video")) {
      content = `
        <video controls
          style="width:100%; border-radius:10px; margin-top:5px;">
          <source src="${fileUrl}">
        </video>
      `;
    }

    else {
      content = `📄 ${file.name}`;
    }

    div.innerHTML = `
      ${content}
      <small>Ready to send</small>
      <span class="timestamp">now</span>
    `;

    chatBody.appendChild(div);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

});
</script>
</body>
</html>
