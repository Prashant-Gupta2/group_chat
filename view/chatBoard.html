<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Group Chat UI</title>

   <style>
        * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111b21;
    }

    .chat-container {
      width: 420px;
      height: 90vh;
      background: #0b141a;
      border-radius: 15px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .top-bar {
      padding: 10px;
      background: #202c33;
      display: flex;
      gap: 10px;
    }

    .top-bar input {
      flex: 1;
      padding: 8px;
      border: none;
      outline: none;
      border-radius: 5px;
    }

    .top-bar button {
      padding: 8px 12px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: #25d366;
      color: white;
    }

    .chat-header {
      height: 70px;
      background: #202c33;
      display: flex;
      align-items: center;
      padding: 0 20px;
      color: white;
      border-bottom: 1px solid #2a3942;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #25d366;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      margin-right: 15px;
      color: white;
    }

    .chat-info h3 {
      font-size: 17px;
    }

    .chat-info p {
      font-size: 12px;
      color: #8696a0;
      margin-top: 3px;
    }

    .chat-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background: #0b141a;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      margin-bottom: 15px;
      border-radius: 10px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .received {
      background: #202c33;
      color: white;
      align-self: flex-start;
    }

    .sent {
      background: #005c4b;
      color: white;
      align-self: flex-end;
    }

    .timestamp {
      display: block;
      font-size: 11px;
      margin-top: 5px;
      text-align: right;
      color: #ddd;
    }

    .chat-footer {
      position: relative;
      background: #202c33;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .chat-footer input[type="text"] {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      border-radius: 25px;
      background: #2a3942;
      color: white;
    }

    .send-btn {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: #25d366;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    #suggestBox {
      position: absolute;
      bottom: 100%;
      left: 10px;
      right: 10px;

      display: flex;
      flex-wrap: wrap;
      gap: 6px;

      padding: 8px;
      margin-bottom: 8px;

      background: #111b21;
      border-radius: 10px;

      z-index: 999;
    }

    .suggest-item {
      background: #2a3942;
      color: white;
      padding: 5px 10px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }

    .suggest-item:hover {
      background: #25d366;
    }
    #previewBox img,
    #previewBox video {
      width: 100%;
      max-height: 200px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    #cancelPreview {
      background: red;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 5px;
    }

    img,
    video {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 10px;
    }

    audio {
      width: 100%;
    }

    a {
      color: #53bdeb;
    }
   </style>

  </head>

  <body>
    <div class="chat-container">
      <!-- ROOM JOIN -->
      <div class="top-bar">
        <input type="text" id="txtemail" placeholder="Enter room name/email" />

        <button id="joinbtn">Join</button>
      </div>

      <!-- HEADER -->
      <div class="chat-header">
        <div class="avatar">G</div>

        <div class="chat-info">
          <h3>Group Chat</h3>
          <p>Online</p>
          <p id="typing"> </p>
        </div>
      </div>

      <!-- CHAT BODY -->
      <div class="chat-body" id="chatBody"></div>
      <!-- PREVIEW AREA -->
      <div
        id="previewBox"
        style="display: none; padding: 10px; background: #111b21"
      ></div>
      <!-- FOOTER -->
      <form class="chat-footer" id="chatForm">

  <div id="suggestBox">
    
  </div>

  <label for="mediaInput">📎</label>
  <input type="file" id="mediaInput" hidden />

  <input type="text" id="messageInput" placeholder="Type a message..." />

  <button class="send-btn" type="submit">➤</button>
</form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

   <script>
window.addEventListener("DOMContentLoaded", () => {
  const API_BASE_URL = "http://localhost:4000";

  const token = localStorage.getItem("token");
  const userId = localStorage.getItem("userId");
  const username = localStorage.getItem("username");

  const chatForm = document.getElementById("chatForm");
  const chatBody = document.getElementById("chatBody");
  const messageInput = document.getElementById("messageInput");
  const joinbtn = document.getElementById("joinbtn");
  const mediaInput = document.getElementById("mediaInput");
  const previewBox = document.getElementById("previewBox");
  const suggestBox = document.getElementById("suggestBox");
  const userTyping = document.getElementById("typing")

  const socket = io(API_BASE_URL, {
    auth: { token },
  });

  let timer;
  let roomName = null;

let debounceTimer;
let currentRequestId = 0;
let abortController = null;

let typing = false;
let typingTimeout;

 function handleInput(text, callback) {
  clearTimeout(debounceTimer);

  if (!text || text.trim().length < 3) {
    suggestBox.innerHTML = "";
    return;
  }

  debounceTimer = setTimeout(async () => {
    try {
      const res = await fetch(`${API_BASE_URL}/ai/predict`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          text,
          userTone: "neutral",
        }),
      });

      const data = await res.json();
      callback(data);

    } catch (err) {
      console.error("Predict error:", err);
    }
  }, 500);
}

  messageInput.addEventListener("input", (e) => {
    const text = e.target.value;

    handleInput(text, (data) => {
      if (!data?.suggestions?.length) {
        suggestBox.innerHTML = "";
        return;
      }

      suggestBox.innerHTML = data.suggestions
        .map(
          (s) => `
          <span class="suggest-item" style="
            margin-right:6px;
            padding:4px 10px;
            background:#2a3942;
            border-radius:12px;
            cursor:pointer;
            display:inline-block;
            color:white;
          ">${s}</span>
        `
        )
        .join("");
    });
     if (!roomName) return;

  if (!typing) {
    typing = true;
    socket.emit("typing", { roomName, username });
  }

  clearTimeout(typingTimeout);

  typingTimeout = setTimeout(() => {
    typing = false;
    socket.emit("stop-typing", { roomName, username });
  }, 1000);
  });

  suggestBox.addEventListener("click", (e) => {
    if (e.target.classList.contains("suggest-item")) {
      messageInput.value += " " + e.target.innerText + " ";
      suggestBox.innerHTML = "";
      messageInput.focus();
    }
  });

  joinbtn.addEventListener("click", () => {
    const room = document.getElementById("txtemail").value.trim();

    if (!room) return alert("Enter room name");

    roomName = room;
    socket.emit("join-room", roomName);

    alert(`Joined room: ${roomName}`);
  });

  // MEDIA PREVIEW
  mediaInput.addEventListener("change", () => {
    const file = mediaInput.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);

    let html = "";

    if (file.type.startsWith("image")) {
      html = `<img src="${url}" />`;
    } else if (file.type.startsWith("video")) {
      html = `<video controls><source src="${url}"></video>`;
    } else {
      html = `📄 ${file.name}`;
    }

    previewBox.style.display = "block";
    previewBox.innerHTML = `
      ${html}
      <br>
      <button id="cancelPreview">Cancel</button>
    `;

    document.getElementById("cancelPreview").onclick = () => {
      mediaInput.value = "";
      previewBox.innerHTML = "";
      previewBox.style.display = "none";
    };
  });

  // SEND MESSAGE
  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!roomName) return alert("Join room first");

    const message = messageInput.value.trim();
    const file = mediaInput.files[0];

    if (message) {
      socket.emit("personal_message", {
        roomName,
        message,
        userId,
      });
    }

    if (file) {
      try {
        const formData = new FormData();
        formData.append("file", file);

        const res = await axios.post(
          `${API_BASE_URL}/chat-app/media-share`,
          formData,
          {
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "multipart/form-data",
            },
          }
        );

        const mediaUrl = res.data.mediaUrl;

        socket.emit("personal_message", {
          roomName,
          message: "",
          mediaUrl,
          mediaType: getMediaType(file.type),
          userId,
        });

        previewBox.innerHTML = "";
        previewBox.style.display = "none";
      } catch (err) {
        console.log(err);
        alert("Media upload failed");
      }
    }

    messageInput.value = "";
    mediaInput.value = "";
    suggestBox.innerHTML = "";
  });

  socket.on("receive_message", appendMessage);

  async function loadMessages() {
    try {
      const response = await axios.get(
        `${API_BASE_URL}/chat-app/get-chats`,
        {
          headers: { Authorization: `Bearer ${token}` },
        }
      );

      chatBody.innerHTML = "";
      response.data.data.forEach(appendMessage);
    } catch (err) {
      console.log(err);
    }
  }

  loadMessages();



socket.on("typing", (data) => {
  userTyping.textContent = `${data.username} is typing...`;
  userTyping.style.display = "block";
});

socket.on("stop-typing", (data) => {
  userTyping.textContent = "";
  userTyping.style.display = "none";
});

  function appendMessage(msg) {
    const div = document.createElement("div");

    const isMe = Number(msg.userId) === Number(userId);

    div.classList.add("message", isMe ? "sent" : "received");

    let content = "";

    if (msg.mediaType === "image") {
      content = `<img src="${msg.mediaUrl}" />`;
    } else if (msg.mediaType === "video") {
      content = `<video controls><source src="${msg.mediaUrl}"></video>`;
    } else if (msg.mediaType === "audio") {
      content = `<audio controls><source src="${msg.mediaUrl}"></audio>`;
    } else if (msg.mediaType === "document") {
      content = `📄 <a href="${msg.mediaUrl}" target="_blank">Download</a>`;
    } else {
      content = escapeHTML(msg.message || "");
    }

    const time = new Date(
      msg.createdAt || Date.now()
    ).toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit",
    });

    div.innerHTML = `
      ${content}
      <span class="timestamp">${time}</span>
    `;

    chatBody.appendChild(div);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function getMediaType(type) {
    if (type.startsWith("image")) return "image";
    if (type.startsWith("video")) return "video";
    if (type.startsWith("audio")) return "audio";
    return "document";
  }

  function escapeHTML(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
});
</script>
  </body>
</html>
